
name: Churn Prediction MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

jobs:
  train-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          
      # 4. Generate dataset
      - name: Generate dataset
        run: |
          mkdir data && cd data
          python3 generate_data.py

      # 5. Train model
      - name: Train model
        run: |
          mkdir models && cd models
          python3 train.py

      # 3. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: push model to s3
        run: |
          aws s3 cp models/churn_model.pkl s3://churn-model-dvc-bucket/models/churn_model.pkl
          echo "Model pushed to S3 successfully."

      - name: Update inference.yaml with s3 model path
        run: | 
          MODEL_URI="s3://churn-model-dvc-bucket/models/churn_model.pkl"
          sed -i "s|storageUri: .*|storageUri: $MODEL_URI|g" k8s-manifests/inference.yaml

      - name: Commit inference.yaml changes
        run: |
          git config user.name "action@github.com"
          git config user.email "Github Action"
          git add k8s-manifests/inference.yaml

          git commit -m "Update inference.yaml with S3 path [skip ci]" || echo "No changes"
          git push || echo "No changes to commit in inference.yaml"